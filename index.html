<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Clientes e Reposição - Tasty Shake</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Versão Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyANpiWqCHpIHO97Y6qGkl9DTaL6psKhBC8",
            authDomain: "tasty-web-c3420.firebaseapp.com",
            projectId: "tasty-web-c3420",
            storageBucket: "tasty-web-c3420.firebasestorage.app",
            messagingSenderId: "216354493205",
            appId: "1:216354493205:web:7933fef0403f792b6a8f1c",
            measurementId: "G-SS99GFG0JF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', () => {
            const vendaForm = document.getElementById('vendaForm');
            const produtoForm = document.getElementById('produtoForm');
            const tabelaClientes = document.getElementById('tabelaClientes');
            const totalClientesEl = document.getElementById('totalClientes');
            const selectProduto = document.getElementById('produto');
            const listaProdutosBadge = document.getElementById('listaProdutosBadge');
            const novoProdutoNomeInput = document.getElementById('novoProdutoNome');

            let produtosPadrao = ['Shake F1', 'Fiber Concentrate', 'Herbal Tea', 'Nutri Soup', 'Multifiber'];

            async function carregarProdutos() {
                try {
                    const querySnapshot = await getDocs(collection(db, "produtos"));
                    let produtos = [];
                    querySnapshot.forEach((doc) => {
                        produtos.push({ id: doc.id, ...doc.data() });
                    });

                    if (produtos.length === 0) {
                        for (let p of produtosPadrao) {
                            await addDoc(collection(db, "produtos"), { nome: p });
                        }
                        return carregarProdutos();
                    }

                    atualizarSelectProdutos(produtos);
                } catch (error) {
                    console.error("Erro ao carregar produtos:", error);
                }
            }

            function atualizarSelectProdutos(produtos) {
                selectProduto.innerHTML = '<option value="">Selecione um produto</option>';
                listaProdutosBadge.innerHTML = '';

                produtos.forEach(prod => {
                    const opt = document.createElement('option');
                    opt.value = prod.nome;
                    opt.textContent = prod.nome;
                    selectProduto.appendChild(opt);

                    const badge = document.createElement('span');
                    badge.className = 'inline-flex items-center bg-slate-100 text-slate-700 text-xs px-3 py-1.5 rounded-full border border-slate-200';
                    badge.innerHTML = `
                        ${prod.nome}
                        <button type="button" onclick="removerProduto('${prod.id}')" class="ml-2 text-slate-400 hover:text-red-600 font-bold px-1">&times;</button>
                    `;
                    listaProdutosBadge.appendChild(badge);
                });
            }

            produtoForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nomeProd = novoProdutoNomeInput.value.trim();
                if (nomeProd) {
                    await addDoc(collection(db, "produtos"), { nome: nomeProd });
                    novoProdutoNomeInput.value = '';
                    carregarProdutos();
                }
            });

            window.removerProduto = async function(id) {
                if (confirm('Deseja remover este produto?')) {
                    await deleteDoc(doc(db, "produtos", id));
                    carregarProdutos();
                }
            }

            async function carregarClientes() {
                try {
                    const querySnapshot = await getDocs(collection(db, "clientes"));
                    let clientes = [];
                    querySnapshot.forEach((doc) => {
                        clientes.push({ id: doc.id, ...doc.data() });
                    });
                    renderizarTabela(clientes);
                } catch (error) {
                    console.error("Erro ao carregar clientes:", error);
                }
            }

            function calcularDiasRestantes(dataVendaStr, quantidade, dose) {
                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0);

                const dataVenda = new Date(dataVendaStr + 'T00:00:00');
                const dataTermino = new Date(dataVenda);
                dataTermino.setDate(dataVenda.getDate() + (quantidade >= dose ? Math.floor(quantidade / dose) : 0));

                const diffTempo = dataTermino - hoje;
                const diasRestantes = Math.ceil(diffTempo / (1000 * 60 * 60 * 24));

                return { diasRestantes, dataTermino };
            }

            function renderizarTabela(clientes) {
                tabelaClientes.innerHTML = '';
                totalClientesEl.textContent = `${clientes.length} ${clientes.length === 1 ? 'cadastro' : 'cadastros'}`;

                if (clientes.length === 0) {
                    tabelaClientes.innerHTML = `
                        <tr>
                            <td colspan="6" class="px-6 py-8 text-center text-slate-400">Nenhum cliente cadastrado ainda.</td>
                        </tr>
                    `;
                    return;
                }

                clientes.forEach((item) => {
                    const { diasRestantes, dataTermino } = calcularDiasRestantes(item.dataVenda, item.quantidade, item.dose);
                    
                    let statusBadge = '';
                    let linhaCor = '';

                    if (diasRestantes <= 0 || item.quantidade < item.dose) {
                        statusBadge = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800 whitespace-nowrap">🔴 Esgotado</span>`;
                        linhaCor = 'bg-red-50/40';
                    } else if (diasRestantes <= 5) {
                        statusBadge = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800 whitespace-nowrap">🟡 Acabando</span>`;
                        linhaCor = 'bg-amber-50/40';
                    } else {
                        statusBadge = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 whitespace-nowrap">🟢 Em Uso</span>`;
                        linhaCor = '';
                    }

                    const dataFormatada = dataTermino.toLocaleDateString('pt-BR');
                    const unidadeTexto = item.unidade || 'unidades';
                    
                    const mensagemWhats = encodeURIComponent(`Olá ${item.cliente}! Tudo bem? Passando para saber como você está se sentindo com o uso do ${item.produto} e se já está precisando repor o seu estoque para não ficar sem!`);
                    const linkWhats = `https://wa.me/55${item.telefone.replace(/\D/g, '')}?text=${mensagemWhats}`;

                    const tr = document.createElement('tr');
                    tr.className = `${linhaCor} hover:bg-slate-50 transition border-b border-slate-100`;
                    tr.innerHTML = `
                        <td class="px-4 sm:px-6 py-4 font-medium text-slate-900 whitespace-nowrap">${item.cliente}</td>
                        <td class="px-4 sm:px-6 py-4 text-slate-600 whitespace-nowrap">${item.produto} <span class="text-xs text-slate-400">(${item.quantidade} ${unidadeTexto})</span></td>
                        <td class="px-4 sm:px-6 py-4 text-slate-600 whitespace-nowrap">${dataFormatada}</td>
                        <td class="px-4 sm:px-6 py-4 font-semibold text-slate-700 whitespace-nowrap">${item.quantidade < item.dose ? '0' : diasRestantes} dias</td>
                        <td class="px-4 sm:px-6 py-4">${statusBadge}</td>
                        <td class="px-4 sm:px-6 py-4 text-right space-x-1 whitespace-nowrap">
                            <a href="${linkWhats}" target="_blank" class="inline-flex items-center bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-2 rounded-lg transition shadow-sm" title="Enviar WhatsApp">
                                WhatsApp
                            </a>
                            <button onclick="renovarCompra('${item.id}')" class="inline-flex items-center bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium px-3 py-2 rounded-lg transition shadow-sm" title="Renovar para a data de hoje">
                                Renovar
                            </button>
                            <button onclick="removerCliente('${item.id}')" class="text-slate-400 hover:text-red-600 text-xs font-medium transition ml-1 p-2" title="Excluir">
                                Excluir
                            </button>
                        </td>
                    `;
                    tabelaClientes.appendChild(tr);
                });
            }

            vendaForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const novoCliente = {
                    cliente: document.getElementById('cliente').value,
                    telefone: document.getElementById('telefone').value,
                    produto: selectProduto.value,
                    quantidade: parseInt(document.getElementById('quantidade').value),
                    unidade: document.getElementById('unidade').value,
                    dose: parseInt(document.getElementById('dose').value),
                    dataVenda: new Date().toISOString().split('T')[0]
                };

                try {
                    await addDoc(collection(db, "clientes"), novoCliente);
                    vendaForm.reset();
                    carregarClientes();
                } catch (error) {
                    alert("Erro ao gravar no Firebase. Verifique a consola (F12).");
                    console.error(error);
                }
            });

            window.renovarCompra = async function(id) {
                if (confirm(`Deseja registrar uma nova compra para hoje?`)) {
                    const dataHoje = new Date().toISOString().split('T')[0];
                    await updateDoc(doc(db, "clientes", id), { dataVenda: dataHoje });
                    carregarClientes();
                }
            }

            window.removerCliente = async function(id) {
                if (confirm('Deseja realmente excluir este registro?')) {
                    await deleteDoc(doc(db, "clientes", id));
                    carregarClientes();
                }
            }

            carregarProdutos();
            carregarClientes();
        });
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-3 sm:p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Cabeçalho -->
        <header class="mb-6 sm:mb-8 text-center flex flex-col items-center">
            <div class="w-20 h-20 sm:w-28 sm:h-28 rounded-full overflow-hidden shadow-md border-2 border-emerald-500 mb-3 sm:mb-4 flex items-center justify-center bg-white">
                <img src="logo.png" alt="Logo Tasty Shake" class="w-full h-full object-cover">
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-1 sm:mb-2">Controle de Clientes e Reposição</h1>
            <p class="text-xs sm:text-sm text-slate-600 px-2">Monitore o consumo dos produtos e saiba a hora exata de fazer uma nova venda.</p>
        </header>

        <!-- Seção de Cadastro de Produtos -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 mb-5 sm:mb-6">
            <h2 class="text-base sm:text-lg font-semibold text-slate-900 mb-3">Gerenciar Produtos</h2>
            <form id="produtoForm" class="flex flex-col sm:flex-row gap-3 items-end">
                <div class="flex-1 w-full">
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nome do Novo Produto</label>
                    <input type="text" id="novoProdutoNome" placeholder="Ex: Shake F1, Nutri Soup..." required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white font-medium px-5 py-2 rounded-lg text-sm transition shadow-sm h-[38px]">
                    Adicionar Produto
                </button
